name: Check mod download counts

on:
  schedule:
    - cron: '30 21 * * *' # UTC. 06:30 JST.
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run mod downloads check
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          chmod +x scripts/check-mod-downloads.sh
          scripts/check-mod-downloads.sh

      - name: Commit updated state
        run: |
          git add mod-downloads-state.json
          if git diff --cached --quiet -- mod-downloads-state.json; then
            echo "No state change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update mod downloads watch state"
          git push
